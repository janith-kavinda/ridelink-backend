server:
  port: 4003

spring:
  application:
    name: ride-service
  data:
    mongodb:
      uri: mongodb://localhost:27017/account_db

jwt:
  secret: ridelink-shared-secret-change-me-to-a-long-random-string
  expiration-ms: 3600000

services:
  driver-service:
    url: http://localhost:4002
  payment-service:
    url: http://localhost:4004

springdoc:
  swagger-ui:
    path: /swagger-ui.html
  api-docs:
    path: /v3/api-docs
